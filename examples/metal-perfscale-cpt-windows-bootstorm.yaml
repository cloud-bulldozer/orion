tests:
  - name: metal-perfscale-cpt-windows-bootstorm
    metadata:
      platform: BareMetal
      clusterType: self-managed
      masterNodesType.keyword: ""
      masterNodesCount: 3
      workerNodesType.keyword: ""
      workerNodesCount: 4
      benchmark.keyword: windows-bootstorm
      networkType: OVNKubernetes
      jobType: "{{ jobtype | default('periodic') }}"
      pullNumber: "{{ pull_number | default(0) }}"
      organization: "{{ organization | default('') }}"
      repository: "{{ repository | default('') }}"
    metrics:
      - name: bootstormSSHTime
        metricName.keyword: bootstormSSHMeasurement
        metric_of_interest: bootstorm_time
        agg:
          agg_type: avg
        threshold: 10
        direction: 1
        labels:
          - "[Jira: PerfScale]"

      - name: bootstormSSHTimeP50
        metricName.keyword: bootstormSSHMeasurement
        metric_of_interest: bootstorm_time
        agg:
          agg_type: percentiles
          percents: [50]
          target_percentile: 50
        threshold: 10
        direction: 1
        labels:
          - "[Jira: PerfScale]"

      - name: bootstormSSHTimeP90
        metricName.keyword: bootstormSSHMeasurement
        metric_of_interest: bootstorm_time
        agg:
          agg_type: percentiles
          percents: [90]
          target_percentile: 90
        threshold: 10
        direction: 1
        labels:
          - "[Jira: PerfScale]"

      - name: vmiReadyLatency
        metricName.keyword: vmiLatencyQuantilesMeasurement
        quantileName: VMReady
        metric_of_interest: P99
        not:
          jobName.keyword: "garbage-collection"
        threshold: 10
        direction: 1
        labels:
          - "[Jira: PerfScale]"

      - name: apiserverCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-kube-apiserver
        metric_of_interest: value
        agg:
          agg_type: avg
        threshold: 10
        direction: 1
        labels:
          - "[Jira: kube-apiserver]"

      - name: multusCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-multus
        metric_of_interest: value
        agg:
          agg_type: avg
        threshold: 10
        direction: 1
        labels:
          - "[Jira: multus]"

      - name: monitoringCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-monitoring
        metric_of_interest: value
        agg:
          agg_type: avg
        threshold: 10
        direction: 1
        labels:
          - "[Jira: monitoring]"

      - name: ovnCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-ovn-kubernetes
        metric_of_interest: value
        agg:
          agg_type: avg
        threshold: 10
        direction: 1
        labels:
          - "[Jira: Networking / ovn-kubernetes]"

      - name: etcdCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-etcd
        metric_of_interest: value
        agg:
          agg_type: avg
        threshold: 10
        direction: 1
        labels:
          - "[Jira: etcd]"

      - name: etcdDisk
        metricName.keyword: 99thEtcdDiskBackendCommitDurationSeconds
        metric_of_interest: value
        agg:
          agg_type: avg
        threshold: 10
        labels:
          - "[Jira: etcd]"

      - name: kubelet
        metricName.keyword: kubeletCPU
        metric_of_interest: value
        agg:
          agg_type: avg
        threshold: 10
        direction: 1
        labels:
          - "[Jira: Node]"
