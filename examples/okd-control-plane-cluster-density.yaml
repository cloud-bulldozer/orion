tests:
  - name: okd-cluster-density-6nodes
    metadata:
      wildcard:
        ocpVersion: "{{ version }}*"
      platform: AWS
      clusterType: self-managed
      masterNodesType: m6a.xlarge
      masterNodesCount: 3
      workerNodesType: m6a.xlarge
      workerNodesCount: 6
      benchmark.keyword: cluster-density-v2
      networkType: OVNKubernetes
      jobType: "{{ jobtype | default('periodic') }}"
      pullNumber: "{{ pull_number | default(0) }}"
      organization: "{{ organization | default('') }}"
      repository: "{{ repository | default('') }}"
      fips: "{{ fips | default('false') }}"
      stream: okd

    metrics:
      - name: podReadyLatency
        metricName.keyword: podLatencyQuantilesMeasurement
        quantileName: Ready
        metric_of_interest: P99
        not:
          jobName.keyword: "garbage-collection"
        labels:
          - "[Jira: PerfScale]"
        direction: 1
        threshold: 10

      - name: apiserverCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-kube-apiserver
        metric_of_interest: value
        agg:
          agg_type: avg
        labels:
          - "[Jira: kube-apiserver]"
        direction: 1

      - name: multusCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-multus
        metric_of_interest: value
        agg:
          agg_type: avg
        labels:
          - "[Jira: multus]"
        direction: 1

      - name: monitoringCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-monitoring
        metric_of_interest: value
        agg:
          agg_type: avg
        labels:
          - "[Jira: monitoring]"
        direction: 1

      - name: ovnCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-ovn-kubernetes
        metric_of_interest: value
        agg:
          agg_type: avg
        labels:
          - "[Jira: Networking / ovn-kubernetes]"
        direction: 1

      - name: etcdCPU
        metricName.keyword: containerCPU
        labels.namespace.keyword: openshift-etcd
        metric_of_interest: value
        agg:
          agg_type: avg
        labels:
          - "[Jira: etcd]"
        direction: 1

      - name: kubelet
        metricName.keyword: kubeletCPU
        metric_of_interest: value
        labels:
          - "[Jira: Node]"
        agg:
          agg_type: avg
        direction: 1

      - name: max-mutating-apicalls-latency-${ag}
        metricName.keyword: max-mutating-apicalls-latency
        metric_of_interest: value
        agg:
          agg_type: ${ag}
        direction: 1
        fan_out:
          - ag: avg
          - ag: max

      - name: max-ro-apicalls-latency-${ag}
        metricName.keyword: max-ro-apicalls-latency
        metric_of_interest: value
        agg:
          agg_type: ${ag}
        direction: 1
        fan_out:
          - ag: avg
          - ag: max

      - name: 99thEtcdCompaction-${ag}
        metricName.keyword: 99thEtcdCompaction
        metric_of_interest: value
        agg:
          agg_type: ${ag}
        direction: 1
        fan_out:
          - ag: sum
          - ag: max

      - name: nodeMajorFaults-${ag}
        metricName.keyword: nodeMajorFaults
        metric_of_interest: value
        agg:
          agg_type: ${ag}
        direction: 1
        fan_out:
          - ag: max
          - ag: sum
