      - name: p2p-tput-8192-1p
        parallelism: 1
        profile: TCP_STREAM
        messageSize: 8192
        driver.keyword: netperf
        hostNetwork: false
        acrossAZ: false
        virt: true
        bridgeInfo.keyword: "{{ bridge_info | default('VM Bridge (10.10.10.12)') }}"
        metric_of_interest: throughput
        direction: -1
        agg:
          agg_type: avg
        threshold: 10
        dry_run: true

      - name: p2p-tput-8192-2p
        parallelism: 2
