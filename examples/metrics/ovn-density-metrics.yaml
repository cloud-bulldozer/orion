# Shared OVN/OVS metrics for udn/cudn density workloads (all scales).
#
# Templating selects the workload the metrics are scoped to:
#   density : "udn" (default) or "cudn"
#   layer   : "l2"  (default) or "l3"
# e.g. --input-vars '{"version":"4.19","density":"cudn","layer":"l3"}'
#
# fan_out collapses the per-container CPU/Memory metrics into two templates.

- name: podReadyLatency
  metricName.keyword: podLatencyQuantilesMeasurement
  quantileName: Ready
  jobName.keyword: "{{ density | default('udn') }}-density-{{ layer | default('l2') }}-pods"
  metric_of_interest: P99
  not:
    jobName.keyword: garbage-collection
  labels:
    - "[Jira: PerfScale]"
  direction: 1
  threshold: 10

- name: ovsCPU-irate-all
  metricName.keyword: cgroupCPU
  jobName.keyword: "{{ density | default('udn') }}-density-{{ layer | default('l2') }}-pods"
  labels.id.keyword: /system.slice/ovs-vswitchd.service
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: ovnkCPU-overall
  metricName.keyword: containerCPU
  jobName.keyword: "{{ density | default('udn') }}-density-{{ layer | default('l2') }}-pods"
  labels.namespace.keyword: openshift-ovn-kubernetes
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: "ovnCPU-${suffix}"
  metricName.keyword: containerCPU
  jobName.keyword: "{{ density | default('udn') }}-density-{{ layer | default('l2') }}-pods"
  labels.namespace.keyword: openshift-ovn-kubernetes
  labels.container.keyword: "${container}"
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10
  fan_out:
    - suffix: ovncontroller
      container: ovn-controller
    - suffix: northd
      container: northd
    - suffix: nbdb
      container: nbdb
    - suffix: sbdb
      container: sbdb
    - suffix: ovnk-controller
      container: ovnkube-controller

- name: "ovsMemory-${node}"
  metricName.keyword: "cgroupMemoryRSS-${node}"
  jobName.keyword: "{{ density | default('udn') }}-density-{{ layer | default('l2') }}-pods"
  labels.id.keyword: /system.slice/ovs-vswitchd.service
  metric_of_interest: value
  agg:
    agg_type: max
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10
  fan_out:
    - node: Workers
    - node: Masters

- name: ovsMemory-all
  metricName.keyword: cgroupMemoryRSS
  jobName.keyword: "{{ density | default('udn') }}-density-{{ layer | default('l2') }}-pods"
  labels.id.keyword: /system.slice/ovs-vswitchd.service
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: ovnkMem-overall
  metricName.keyword: containerMemory
  jobName.keyword: "{{ density | default('udn') }}-density-{{ layer | default('l2') }}-pods"
  labels.namespace.keyword: openshift-ovn-kubernetes
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: "ovnMem-${suffix}"
  metricName.keyword: containerMemory
  jobName.keyword: "{{ density | default('udn') }}-density-{{ layer | default('l2') }}-pods"
  labels.namespace.keyword: openshift-ovn-kubernetes
  labels.container.keyword: "${container}"
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10
  fan_out:
    - suffix: ovncontroller
      container: ovn-controller
    - suffix: northd
      container: northd
    - suffix: nbdb
      container: nbdb
    - suffix: sbdb
      container: sbdb
    - suffix: ovnk-controller
      container: ovnkube-controller
