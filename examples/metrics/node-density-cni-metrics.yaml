# Shared metrics for node-density-cni workloads (med/large scale).
# Per-namespace CPU and per-container ovn CPU/Memory metrics use fan_out.

- name: podReadyLatency
  metricName.keyword: podLatencyQuantilesMeasurement
  quantileName: Ready
  metric_of_interest: P99
  not:
    jobName.keyword: garbage-collection
  labels:
    - "[Jira: PerfScale]"
  direction: 1
  threshold: 10

- name: serviceReadyLatency
  metricName.keyword: serviceLatencyQuantilesMeasurement
  quantileName: Ready
  metric_of_interest: P99
  not:
    jobName.keyword: garbage-collection
  labels:
    - "[Jira: PerfScale]"
  direction: 1
  threshold: 10

- name: "${name}"
  metricName.keyword: containerCPU
  labels.namespace.keyword: "${namespace}"
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: ${jira}]"
  direction: 1
  threshold: 10
  fan_out:
    - name: apiserverCPU
      namespace: openshift-kube-apiserver
      jira: kube-apiserver
    - name: multusCPU
      namespace: openshift-multus
      jira: multus
    - name: monitoringCPU
      namespace: openshift-monitoring
      jira: monitoring
    - name: etcdCPU
      namespace: openshift-etcd
      jira: etcd

- name: kubelet
  metricName.keyword: kubeletCPU
  metric_of_interest: value
  labels:
    - "[Jira: Node]"
  agg:
    agg_type: avg
  direction: 1
  threshold: 10

- name: ovsCPU-irate-all
  metricName.keyword: cgroupCPU
  labels.id.keyword: /system.slice/ovs-vswitchd.service
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: ovnkCPU-overall
  metricName.keyword: containerCPU
  labels.namespace.keyword: openshift-ovn-kubernetes
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: "ovnCPU-${suffix}"
  metricName.keyword: containerCPU
  labels.namespace.keyword: openshift-ovn-kubernetes
  labels.container.keyword: "${container}"
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10
  fan_out:
    - suffix: ovncontroller
      container: ovn-controller
    - suffix: northd
      container: northd
    - suffix: nbdb
      container: nbdb
    - suffix: sbdb
      container: sbdb
    - suffix: ovnk-controller
      container: ovnkube-controller

- name: "ovsMemory-${node}"
  metricName.keyword: "cgroupMemoryRSS-${node}"
  labels.id.keyword: /system.slice/ovs-vswitchd.service
  metric_of_interest: value
  agg:
    agg_type: max
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10
  fan_out:
    - node: Workers
    - node: Masters

- name: ovsMemory-all
  metricName.keyword: cgroupMemoryRSS
  labels.id.keyword: /system.slice/ovs-vswitchd.service
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: ovnkMem-overall
  metricName.keyword: containerMemory
  labels.namespace.keyword: openshift-ovn-kubernetes
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: "ovnMem-${suffix}"
  metricName.keyword: containerMemory
  labels.namespace.keyword: openshift-ovn-kubernetes
  labels.container.keyword: "${container}"
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10
  fan_out:
    - suffix: ovncontroller
      container: ovn-controller
    - suffix: northd
      container: northd
    - suffix: nbdb
      container: nbdb
    - suffix: sbdb
      container: sbdb
    - suffix: ovnk-controller
      container: ovnkube-controller
