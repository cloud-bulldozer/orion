# Shared metrics for ROSA HCP density workloads.

# --- Pod Latency ---

- name: podReadyLatency
  metricName.keyword: podLatencyQuantilesMeasurement
  quantileName: Ready
  metric_of_interest: P99
  not:
    jobName.keyword: "garbage-collection"
  labels:
    - "[Jira: PerfScale]"
  direction: 1
  threshold: 10

# --- Hosted Control Plane (management cluster) ---

- name: apiserverCPU
  metricName.keyword: podCPU-Controlplane
  labels.container.keyword: kube-apiserver
  metric_of_interest: value
  agg:
    value: cpu
    agg_type: avg
  labels:
    - "[Jira: kube-apiserver]"
  direction: 1
  threshold: 10

- name: apiserverMemory
  metricName.keyword: podMemory-Controlplane
  labels.container.keyword: kube-apiserver
  metric_of_interest: value
  agg:
    value: memory
    agg_type: max
  labels:
    - "[Jira: kube-apiserver]"
  direction: 1
  threshold: 10

- name: etcdCPU
  metricName.keyword: podCPU-Controlplane
  labels.container.keyword: etcd
  metric_of_interest: value
  agg:
    value: cpu
    agg_type: avg
  labels:
    - "[Jira: etcd]"
  direction: 1
  threshold: 10

- name: etcdMemory
  metricName.keyword: podMemory-Controlplane
  labels.container.keyword: etcd
  metric_of_interest: value
  agg:
    value: memory
    agg_type: max
  labels:
    - "[Jira: etcd]"
  direction: 1
  threshold: 10

- name: ovnCPU-controlplane
  metricName.keyword: podCPU-Controlplane
  labels.container.keyword: ovnkube-control-plane
  metric_of_interest: value
  agg:
    value: cpu
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: etcdRoundTrip
  metricName.keyword: 99thEtcdRoundTripTimeSeconds
  metric_of_interest: value
  agg:
    value: duration
    agg_type: avg
  labels:
    - "[Jira: etcd]"
  direction: 1
  threshold: 10

- name: etcdLeaderChanges
  metricName.keyword: etcdLeaderChangesRate
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: etcd]"
  direction: 1
  threshold: 10

- name: etcdWALFsyncLatency
  metricName.keyword: 99thEtcdDiskWalFsyncDurationSeconds
  metric_of_interest: value
  agg:
    value: duration
    agg_type: avg
  labels:
    - "[Jira: etcd]"
  direction: 1
  threshold: 10

